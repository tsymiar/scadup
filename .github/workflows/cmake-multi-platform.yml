# scadup CI -- build the library and the tool on every supported platform.
# make.sh / make.bat end with the smoke test, so it runs on all three.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  posix:
    name: ${{ matrix.os }} (${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: macos-latest
            cxx: clang++

    steps:
    - uses: actions/checkout@v4

    - name: Build and smoke test
      env:
        CXX: ${{ matrix.cxx }}
      # bash make.sh: does not need the executable bit, and honours CXX
      run: bash make.sh

  windows:
    name: windows-latest (msvc)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Disable runner firewall
      # The broker listens during the smoke test; the runner firewall would
      # raise an interactive prompt and hang the job (ephemeral VM).
      run: netsh advfirewall set allprofiles state off

    - name: Build and smoke test
      run: .\make.bat
