<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>

  <!-- title -->
  <text x="640" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Scadup Architecture &#8212; Pub/Sub Message Broker</text>
  <text x="640" y="68" text-anchor="middle" font-size="13" fill="#6b7280">Publisher publishes &#183; Broker relays &#183; Subscriber receives</text>

  <!-- ================= Publisher ================= -->
  <rect x="60" y="100" width="300" height="170" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="60" y="100" width="300" height="30" rx="10" fill="#2563eb"/>
  <text x="210" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Publisher (Short)</text>
  <rect x="100" y="148" width="220" height="34" rx="17" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1e3a8a">setup(IP,PORT)</text>
  <rect x="100" y="200" width="220" height="34" rx="17" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="222" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#1e3a8a">publish(topic,data)</text>
  <text x="210" y="258" text-anchor="middle" font-size="11" fill="#6b7280">short-lived: quit() or destructor closes it</text>

  <!-- ================= Broker ================= -->
  <rect x="490" y="100" width="300" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="490" y="100" width="300" height="30" rx="10" fill="#16a34a"/>
  <text x="640" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Broker (Singleton)</text>
  <rect x="530" y="148" width="220" height="34" rx="17" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#14532d">setup(PORT)</text>
  <rect x="530" y="200" width="220" height="34" rx="17" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="222" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#14532d">broker()</text>
  <text x="640" y="258" text-anchor="middle" font-size="11" fill="#6b7280">blocks until exit(); one thread per connection</text>

  <!-- ================= Subscriber ================= -->
  <rect x="920" y="100" width="300" height="170" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <rect x="920" y="100" width="300" height="30" rx="10" fill="#db2777"/>
  <text x="1070" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Subscriber (Long)</text>
  <rect x="960" y="148" width="220" height="34" rx="17" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
  <text x="1070" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#831843">setup(IP,PORT)</text>
  <rect x="960" y="200" width="220" height="34" rx="17" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
  <text x="1070" y="222" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#831843">subscribe(topic,cb)</text>
  <text x="1070" y="258" text-anchor="middle" font-size="11" fill="#6b7280">recv() blocks; keep-alive every 300 ms</text>

  <!-- ================= cross arrows ================= -->
  <line x1="360" y1="163" x2="484" y2="163" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="423" y="152" text-anchor="middle" font-size="11" fill="#2563eb">publish</text>

  <line x1="490" y1="213" x2="366" y2="213" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="427" y="203" text-anchor="middle" font-size="11" fill="#6b7280">ack: delivered</text>

  <line x1="920" y1="163" x2="796" y2="163" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="857" y="152" text-anchor="middle" font-size="11" fill="#dc2626">subscribe</text>

  <!-- forward: send -> subscriber -->
  <path d="M 1040 400 C 1030 360 1020 310 1012 272" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1048" y="340" font-size="11" fill="#16a34a">forward</text>

  <!-- callback: subscriber -> send -->
  <path d="M 1140 270 C 1140 320 1130 360 1122 398" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowPurple)"/>
  <text x="1148" y="335" font-size="11" fill="#7c3aed">callback</text>

  <!-- ================= pipeline ================= -->
  <!-- recv -->
  <circle cx="160" cy="388" r="11" fill="#f97316"/>
  <text x="160" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <rect x="60" y="400" width="200" height="64" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="160" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">recv</text>
  <text x="160" y="448" text-anchor="middle" font-size="10.5" fill="#9a3412">exact-length frames</text>

  <!-- route -->
  <circle cx="400" cy="388" r="11" fill="#f97316"/>
  <text x="400" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <rect x="300" y="400" width="200" height="64" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="400" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">route</text>
  <text x="400" y="448" text-anchor="middle" font-size="10.5" fill="#9a3412">by topic and dst</text>

  <!-- enqueue -->
  <circle cx="640" cy="388" r="11" fill="#f97316"/>
  <text x="640" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <rect x="540" y="400" width="200" height="64" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="640" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">enqueue</text>
  <text x="640" y="448" text-anchor="middle" font-size="10.5" fill="#9a3412">callback pool &#215; 3</text>

  <!-- dispatch -->
  <circle cx="880" cy="388" r="11" fill="#f97316"/>
  <text x="880" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
  <rect x="780" y="400" width="200" height="64" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="880" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">dispatch</text>
  <text x="880" y="448" text-anchor="middle" font-size="10.5" fill="#9a3412">match subscribers</text>

  <!-- send -->
  <circle cx="1120" cy="388" r="11" fill="#f97316"/>
  <text x="1120" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">5</text>
  <rect x="1020" y="400" width="200" height="64" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="1120" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">send</text>
  <text x="1120" y="448" text-anchor="middle" font-size="10.5" fill="#9a3412">per-peer lock</text>

  <!-- pipeline arrows -->
  <line x1="260" y1="432" x2="294" y2="432" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="500" y1="432" x2="534" y2="432" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="740" y1="432" x2="774" y2="432" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="980" y1="432" x2="1014" y2="432" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- group labels -->
  <rect x="60" y="510" width="440" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="280" y="537" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#374151">Topic Routing</text>

  <rect x="540" y="510" width="200" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="640" y="537" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#374151">Message Queue</text>

  <rect x="780" y="510" width="440" height="44" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="1000" y="537" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#374151">Dispatch</text>

  <!-- dashed connectors: recv -> routing, enqueue -> queue, send -> dispatch -->
  <line x1="160" y1="464" x2="160" y2="504" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="640" y1="464" x2="640" y2="504" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="1120" y1="464" x2="1120" y2="504" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ================= legend ================= -->
  <rect x="60" y="590" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="86" y="604" font-size="12" fill="#374151">Publisher</text>
  <rect x="210" y="590" width="18" height="18" rx="4" fill="#fce7f3" stroke="#db2777"/>
  <text x="236" y="604" font-size="12" fill="#374151">Subscriber</text>
  <rect x="360" y="590" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="386" y="604" font-size="12" fill="#374151">Broker</text>
  <rect x="510" y="590" width="18" height="18" rx="4" fill="#fff7ed" stroke="#f97316"/>
  <text x="536" y="604" font-size="12" fill="#374151">Process</text>

  <line x1="60" y1="636" x2="92" y2="636" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="100" y="640" font-size="12" fill="#374151">publish</text>
  <line x1="190" y1="636" x2="222" y2="636" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="230" y="640" font-size="12" fill="#374151">subscribe</text>
  <line x1="320" y1="636" x2="352" y2="636" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="360" y="640" font-size="12" fill="#374151">forward</text>
  <line x1="450" y1="636" x2="482" y2="636" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowPurple)"/>
  <text x="490" y="640" font-size="12" fill="#374151">callback</text>
  <line x1="580" y1="636" x2="612" y2="636" stroke="#6b7280" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="620" y="640" font-size="12" fill="#374151">ack / delivery report</text>

  <!-- ================= notes ================= -->
  <rect x="60" y="690" width="1160" height="92" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="80" y="718" font-size="12.5" fill="#374151">Wire frame: [Header][status][content] &#8212; Header::size covers all of it; reads are exact-length, so a truncated frame is dropped.</text>
  <text x="80" y="742" font-size="12.5" fill="#374151">dst = 0 broadcasts to every subscriber of the topic; dst &#8800; 0 targets one, by its registered dstId or the broker-assigned ssid.</text>
  <text x="80" y="766" font-size="12.5" fill="#374151">A payload is up to 4 MB and may contain zeros; the subscriber callback receives a copy on a pool of three threads.</text>
</svg>
